<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Live — write Markdown and see it rendered, offline</title>
<meta name="description" content="A local Markdown editor: type on the left, see clean HTML on the right. Nothing is uploaded, works from a saved file.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3; --panel:#fff; --ink:#1f2320; --soft:#4a504b; --muted:#838a84;
    --line:rgba(31,35,32,0.14); --line-soft:rgba(31,35,32,0.07);
    --accent:#2f5d4a; --accent-soft:rgba(47,93,74,0.09);
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --display:'Instrument Serif',Georgia,serif;
    --prose:'Source Serif 4',Georgia,serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131614; --panel:#1a1f1c; --ink:#e8ece7; --soft:#c0c7c0; --muted:#8b938c;
      --line:rgba(232,236,231,0.16); --line-soft:rgba(232,236,231,0.08);
      --accent:#8fc0a5; --accent-soft:rgba(143,192,165,0.13);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--prose);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  a{color:var(--accent)}
  header{border-bottom:1px solid var(--line-soft);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--panel)}
  .brand{font-family:var(--display);font-size:21px;letter-spacing:-.01em}
  .brand em{font-style:italic;color:var(--accent)}
  .brand span{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
  .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button{appearance:none;cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--soft);
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 11px}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary:hover{filter:brightness(1.08);color:#fff}
  .split{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
  @media(max-width:820px){.split{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
  .pane{display:flex;flex-direction:column;min-height:0;min-width:0}
  .pane + .pane{border-left:1px solid var(--line-soft)}
  @media(max-width:820px){.pane + .pane{border-left:none;border-top:1px solid var(--line-soft)}}
  .pane h2{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
    padding:9px 16px;border-bottom:1px solid var(--line-soft);background:var(--panel);font-weight:500}
  textarea{flex:1;width:100%;border:none;resize:none;background:var(--bg);color:var(--ink);
    font-family:var(--mono);font-size:13.5px;line-height:1.7;padding:18px}
  textarea:focus{outline:none}
  #preview{flex:1;overflow:auto;padding:22px 26px;background:var(--panel);min-height:0}
  #preview > *:first-child{margin-top:0}
  #preview h1,#preview h2,#preview h3,#preview h4{font-family:var(--display);font-weight:400;line-height:1.2;margin:1.4em 0 .5em;letter-spacing:-.01em}
  #preview h1{font-size:2em;border-bottom:1px solid var(--line-soft);padding-bottom:.2em}
  #preview h2{font-size:1.5em}
  #preview h3{font-size:1.2em}
  #preview p{margin:.9em 0}
  #preview ul,#preview ol{margin:.9em 0 .9em 1.4em}
  #preview li{margin:.25em 0}
  #preview code{font-family:var(--mono);font-size:.85em;background:var(--accent-soft);padding:.12em .35em;border-radius:3px}
  #preview pre{background:var(--bg);border:1px solid var(--line-soft);border-radius:8px;padding:14px;overflow:auto;margin:1em 0}
  #preview pre code{background:none;padding:0;font-size:.85em}
  #preview blockquote{border-left:3px solid var(--accent);margin:1em 0;padding:.2em 0 .2em 1em;color:var(--soft)}
  #preview hr{border:none;border-top:1px solid var(--line);margin:1.6em 0}
  #preview table{border-collapse:collapse;margin:1em 0;font-size:.92em}
  #preview th,#preview td{border:1px solid var(--line);padding:.4em .7em;text-align:left}
  #preview th{background:var(--bg);font-weight:600}
  #preview a{text-decoration:none;border-bottom:1px dotted var(--accent)}
  #preview img{max-width:100%}
  .foot{border-top:1px solid var(--line-soft);padding:9px 22px;display:flex;justify-content:space-between;gap:14px;
    flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel)}
  .foot a{color:var(--soft);text-decoration:none}
  .foot a:hover{color:var(--accent)}
  .status{font-family:var(--mono);font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="brand">Markdown<em>Live</em><span>local editor</span></div>
  <div class="tools">
    <button id="load-sample">Sample</button>
    <button id="copy-html">Copy HTML</button>
    <button class="primary" id="download">Download .html</button>
    <button id="clear">Clear</button>
  </div>
</header>

<div class="split">
  <div class="pane">
    <h2>Markdown</h2>
    <textarea id="input" spellcheck="false" placeholder="# Start typing&#10;&#10;Nothing here is uploaded. Save this page and it works offline forever."></textarea>
  </div>
  <div class="pane">
    <h2>Rendered</h2>
    <div id="preview"></div>
  </div>
</div>

<div class="foot">
  <span>Built by <a href="https://github.com/QuantumCoder-14">Siddhant Neekhra</a> · MIT with Commons Clause</span>
  <span class="status" id="status">ready</span>
</div>

<script>
(function () {
  'use strict';

  /* ================= CORE (tested separately) ================= */
  // <<CORE
  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function inline(text) {
    // Input is already escaped, so these substitutions cannot inject markup.
    var out = text;
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
    out = out.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" rel="noopener noreferrer">$1</a>');
    return out;
  }

  function mdToHtml(markdown) {
    var lines = String(markdown).replace(/\r\n?/g, '\n').split('\n');
    var html = [];
    var listStack = [];
    var inCode = false;
    var codeLines = [];
    var paragraph = [];

    function closeParagraph() {
      if (paragraph.length) {
        html.push('<p>' + inline(paragraph.join(' ')) + '</p>');
        paragraph = [];
      }
    }
    function closeLists() {
      while (listStack.length) html.push('</' + listStack.pop() + '>');
    }

    for (var i = 0; i < lines.length; i++) {
      var raw = lines[i];
      var line = escapeHtml(raw);

      if (/^```/.test(raw.trim())) {
        if (inCode) {
          html.push('<pre><code>' + codeLines.join('\n') + '</code></pre>');
          codeLines = []; inCode = false;
        } else {
          closeParagraph(); closeLists(); inCode = true;
        }
        continue;
      }
      if (inCode) { codeLines.push(escapeHtml(raw)); continue; }

      if (!raw.trim()) { closeParagraph(); closeLists(); continue; }

      var heading = /^(#{1,6})\s+(.*)$/.exec(line);
      if (heading) {
        closeParagraph(); closeLists();
        var level = heading[1].length;
        html.push('<h' + level + '>' + inline(heading[2]) + '</h' + level + '>');
        continue;
      }

      if (/^(-{3,}|\*{3,}|_{3,})$/.test(raw.trim())) {
        closeParagraph(); closeLists(); html.push('<hr>'); continue;
      }

      var quote = /^&gt;\s?(.*)$/.exec(line);
      if (quote) {
        closeParagraph(); closeLists();
        html.push('<blockquote>' + inline(quote[1]) + '</blockquote>');
        continue;
      }

      var bullet = /^[-*+]\s+(.*)$/.exec(line);
      if (bullet) {
        closeParagraph();
        if (!listStack.length || listStack[listStack.length - 1] !== 'ul') {
          closeLists(); html.push('<ul>'); listStack.push('ul');
        }
        html.push('<li>' + inline(bullet[1]) + '</li>');
        continue;
      }

      var numbered = /^\d+\.\s+(.*)$/.exec(line);
      if (numbered) {
        closeParagraph();
        if (!listStack.length || listStack[listStack.length - 1] !== 'ol') {
          closeLists(); html.push('<ol>'); listStack.push('ol');
        }
        html.push('<li>' + inline(numbered[1]) + '</li>');
        continue;
      }

      closeLists();
      paragraph.push(line.trim());
    }

    if (inCode && codeLines.length) html.push('<pre><code>' + codeLines.join('\n') + '</code></pre>');
    closeParagraph(); closeLists();
    return html.join('\n');
  }
  // CORE>>

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = { mdToHtml: mdToHtml, escapeHtml: escapeHtml, inline: inline };
  }

  /* ================= UI ================= */
  var $ = function (id) { return document.getElementById(id); };
  var STORE = 'markdown-live-draft';

  function render() {
    $('preview').innerHTML = mdToHtml($('input').value);
    var text = $('input').value;
    var words = text.trim() ? text.trim().split(/\s+/).length : 0;
    $('status').textContent = words + ' words · ' + text.length + ' characters';
  }

  var timer = null;
  $('input').addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(render, 80);
    try { localStorage.setItem(STORE, $('input').value); } catch (err) { /* private mode */ }
  });

  $('load-sample').addEventListener('click', function () {
    $('input').value = [
      '# Markdown Live',
      '',
      'A **local** editor. Type on the left, read on the right. Your draft is kept in this',
      'browser only, never sent anywhere.',
      '',
      '## What it handles',
      '',
      '- headings, **bold**, *italic*, `inline code`',
      '- lists, both kinds:',
      '  1. like this',
      '  2. and like that',
      '- [links](https://github.com/QuantumCoder-14) and ~~strikethrough~~',
      '',
      '> Quotes work too, which is useful for notes.',
      '',
      '```',
      'Fenced code blocks keep their spacing.',
      '```',
      '',
      '---',
      '',
      'Press **Copy HTML** to take the output, or **Download .html** for a standalone file.'
    ].join('\n');
    render();
    try { localStorage.setItem(STORE, $('input').value); } catch (err) {}
  });

  $('copy-html').addEventListener('click', function () {
    var html = mdToHtml($('input').value);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(html);
      $('status').textContent = 'HTML copied';
      setTimeout(render, 1200);
    }
  });

  $('download').addEventListener('click', function () {
    var body = mdToHtml($('input').value);
    var doc = '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Document</title>\n' +
      '<style>body{max-width:44rem;margin:3rem auto;padding:0 1.25rem;font:16px/1.65 Georgia,serif;color:#1f2320}' +
      'pre{background:#f4f4f1;padding:1rem;overflow:auto;border-radius:6px}code{font-family:ui-monospace,monospace;font-size:.9em}' +
      'blockquote{border-left:3px solid #2f5d4a;margin:1rem 0;padding-left:1rem;color:#4a504b}' +
      'table{border-collapse:collapse}th,td{border:1px solid #ddd;padding:.4rem .7rem}</style>\n</head>\n<body>\n' +
      body + '\n</body>\n</html>\n';
    var blob = new Blob([doc], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'document.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  });

  $('clear').addEventListener('click', function () {
    $('input').value = '';
    render();
    try { localStorage.removeItem(STORE); } catch (err) {}
  });

  try {
    var saved = localStorage.getItem(STORE);
    if (saved) $('input').value = saved;
  } catch (err) { /* private mode */ }
  render();
})();
</script>
</body>
</html>
